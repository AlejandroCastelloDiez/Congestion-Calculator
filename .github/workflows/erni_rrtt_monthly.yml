name: Download ERNI RR.TT (TNP) monthly

on:
  workflow_dispatch:
  schedule:
    # Run monthly on the 20th at 06:30 UTC (adjust as you like)
    - cron: "30 6 20 * *"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download ERNI RR.TT PDF
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python download_erni_rrtt.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add ERNI RR.TT TNP PDF (monthly)"
          git push
