name: Curtailment map

on:
  schedule:
    - cron: "10 7 15 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick working directory
        id: wd
        run: |
          if [ -d "Congestion-Calculator" ]; then
            echo "dir=Congestion-Calculator" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ steps.wd.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute year/month (previous month)
        id: ym
        run: |
          TZ=Europe/Madrid
          YEAR=$(date -d "$(date +%Y-%m-15) -1 month" +%Y)
          MONTH=$(date -d "$(date +%Y-%m-15) -1 month" +%m)
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - name: Run script
        working-directory: ${{ steps.wd.outputs.dir }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python curtailmentmap.py --year ${{ steps.ym.outputs.year }} --month ${{ steps.ym.outputs.month }}

      - name: Commit outputs
        working-directory: ${{ steps.wd.outputs.dir }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs || true
          git commit -m "Update curtailment outputs (${{ steps.ym.outputs.year }}-${{ steps.ym.outputs.month }})" || exit 0
          git push
